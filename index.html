<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Drukarnia u Antka – Strona główna</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ======== STYL PREMIUM (ten sam co koszyk) ======== */
:root {
    --bg: #0f172a;
    --card-bg: #111827;
    --accent: #3b82f6;
    --accent-soft: #1d4ed8;
    --text-main: #e5e7eb;
    --text-muted: #9ca3af;
    --border: #1f2937;
}

body {
    font-family: system-ui;
    background: radial-gradient(circle at top, #1f2937 0, #020617 55%);
    margin: 0;
    padding: 16px;
    color: var(--text-main);
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
}

.logo {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #3b82f6, #22c55e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 20px;
    color: white;
}

.brand-title {
    font-size: 18px;
    font-weight: 600;
}

.cart-btn {
    font-size: 26px;
    text-decoration: none;
    color: var(--text-main);
}

.products {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.product-card {
    background: var(--card-bg);
    border-radius: 18px;
    border: 1px solid var(--border);
    padding: 14px;
    display: flex;
    gap: 14px;
    align-items: center;
    text-decoration: none;
    color: var(--text-main);
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
}

.product-img {
    width: 70px;
    height: 70px;
    border-radius: 14px;
    background: #020617;
    border: 1px solid #1f2937;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--text-muted);
}

.product-name {
    font-size: 16px;
    font-weight: 600;
}

.product-meta {
    font-size: 12px;
    color: var(--text-muted);
}
</style>
</head>
<body>

<div class="header">
    <div class="logo">A</div>
    <div class="brand-title">Drukarnia u Antka</div>
    <a class="cart-btn" href="https://dlaelektroant-dot.github.io/DrukarniaUantkaK/">🛒</a>
</div>

<h2>Produkty</h2>

<div class="products">

    <a class="product-card" href="https://dlaelektroant-dot.github.io/DrukarniaUantkaP1/">
        <div class="product-img">P1</div>
        <div>
            <div class="product-name">Kostka 3D</div>
            <div class="product-meta">Druk 3D • 10 zł</div>
        </div>
    </a>

    <a class="product-card" href="https://dlaelektroant-dot.github.io/DrukarniaUantkaP2/">
        <div class="product-img">P2</div>
        <div>
            <div class="product-name">Figurka 3D</div>
            <div class="product-meta">Druk 3D • 15 zł</div>
        </div>
    </a>

</div>

</body>
</html>
